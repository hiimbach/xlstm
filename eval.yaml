# Description: Config file for sLSTM-only model
training:
  batch_size: 16
  lr: 0.001
  seed: 42
  val_every_epoch: 1
  num_epochs: 100
  lr_warmup_steps: 1000
  lr_decay_until_steps: 10000
  lr_decay_factor: 0.001
  weight_decay: 0.1
  device: cuda
  amp_precision: bfloat16
  weight_precision: float32
  enable_mixed_precision: true
  save_checkpoint: 'test_512.pth'

model:
  num_blocks: 2
  embedding_dim: 1024
  mlstm_block:
    mlstm:
      num_heads: 1
  slstm_block: {}
  slstm_at: []
  context_length: ${dataset.kwargs.context_length}
  vocab_size: ${dataset.kwargs.vocab_size}

tokenizer: VietAI/envit5-base

dataset:
  name: hiimbach/envi_translation
  kwargs:
    vocab_size: 50101
    enable_mask: true
    context_length: 256
    min_sequence_length: 1
    max_sequence_length: 40
